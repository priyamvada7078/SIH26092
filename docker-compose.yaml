services:
  backend:
    build:
      context: ./backend
    container_name: sih26092-backend
    ports:
      - "10000:10000"

  frontend:
    image: node:22-slim
    container_name: sih26092-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:10000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend